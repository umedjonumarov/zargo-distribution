<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZarGo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-950:#0F3D3E;
    --teal-800:#155248;
    --cream:#FBF7EF;
    --cream-card:#FFFFFF;
    --amber:#E8863A;
    --amber-dark:#C96A22;
    --green:#2F7A5C;
    --ink:#1D2B28;
    --ink-soft:#6B7A76;
    --line:#EDE7DA;
    --red:#C6483D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--cream);
    color:var(--ink);
    overflow-x:hidden;
    padding-bottom:90px;
  }
  h1,h2,.disp{font-family:'Fraunces',serif;}

  /* ===== Loading ===== */
  #loadingScreen{
    position:fixed;inset:0;background:var(--teal-950);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    z-index:999;
  }
  .load-star{font-size:38px;animation:pulse 1.3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.15);opacity:.7;}}
  #loadingScreen div.txt{color:rgba(251,247,239,.6);font-size:12.5px;letter-spacing:.02em;}

  #errorScreen{display:none;position:fixed;inset:0;background:var(--cream);z-index:998;align-items:center;justify-content:center;padding:30px;text-align:center;}
  #errorScreen.show{display:flex;flex-direction:column;}
  #errorScreen .emoji{font-size:44px;margin-bottom:12px;}
  #errorScreen p{color:var(--ink-soft);font-size:13.5px;line-height:1.6;max-width:280px;}

  /* ===== Header ===== */
  .header{
    background:var(--teal-950);
    padding:18px 16px 16px;
    border-radius:0 0 22px 22px;
    color:var(--cream);
  }
  .header-greet{font-size:11.5px;opacity:.6;letter-spacing:.03em;text-transform:uppercase;}
  .header-name{font-family:'Fraunces',serif;font-size:22px;font-weight:700;margin-top:2px;}
  .header-debt{
    margin-top:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 13px;
    display:flex;justify-content:space-between;align-items:center;font-size:12px;
  }
  .header-debt .amt{font-weight:700;font-size:14px;}
  .header-debt .amt.warn{color:#FFB199;}

  /* ===== Category tabs ===== */
  .cat-scroll{
    display:flex;gap:8px;padding:14px 16px 4px;overflow-x:auto;
    -ms-overflow-style:none;scrollbar-width:none;
  }
  .cat-scroll::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex-shrink:0;padding:9px 16px;border-radius:20px;font-size:12.5px;font-weight:600;
    background:var(--cream-card);border:1.5px solid var(--line);color:var(--ink-soft);
    cursor:pointer;transition:all .2s ease;white-space:nowrap;
  }
  .cat-pill.active{background:var(--teal-950);border-color:var(--teal-950);color:var(--cream);transform:scale(1.03);}

  /* ===== Product grid ===== */
  .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
    padding:12px 16px 20px;
  }
  .pcard{
    background:var(--cream-card);border-radius:16px;overflow:hidden;
    box-shadow:0 1px 3px rgba(15,61,62,.08);
    transition:transform .15s ease;
    display:flex;flex-direction:column;
  }
  .pcard.bump{animation:bump .3s ease;}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(.96);}100%{transform:scale(1);}}
  .pcard-img{
    width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    font-size:40px;background:linear-gradient(135deg,#F4EDE0,#EDE4D3);
    position:relative;overflow:hidden;
  }
  .pcard-img img{width:100%;height:100%;object-fit:cover;}
  .stock-badge{
    position:absolute;top:6px;right:6px;background:rgba(15,61,62,.85);color:var(--cream);
    font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;
  }
  .pcard-body{padding:10px 11px 12px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .pcard-name{font-size:12.5px;font-weight:700;line-height:1.25;min-height:32px;}
  .pcard-price{font-size:13.5px;font-weight:800;color:var(--green);}
  .pcard-package-info{font-size:10px;color:var(--ink-soft);margin-top:-3px;}
  .pcard-actions{margin-top:auto;}

  .add-btn{
    width:100%;background:var(--teal-950);color:var(--cream);border:none;border-radius:10px;
    padding:9px;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s;
  }
  .add-btn:active{background:var(--amber);}

  .stepper{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--teal-950);border-radius:10px;padding:4px;
  }
  .stepper button{
    width:26px;height:26px;border:none;border-radius:7px;background:rgba(255,255,255,.12);
    color:var(--cream);font-size:15px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .1s;
  }
  .stepper button:active{transform:scale(.85);background:var(--amber);}
  .stepper .qty{color:var(--cream);font-weight:700;font-size:13px;min-width:20px;text-align:center;}
  .qty.bump{animation:qtybump .25s ease;}
  @keyframes qtybump{0%{transform:scale(1);}50%{transform:scale(1.35);}100%{transform:scale(1);}}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:13px;}

  /* ===== Floating cart bar ===== */
  .cart-bar{
    position:fixed;left:16px;right:16px;bottom:16px;
    background:var(--green);color:#fff;border-radius:16px;
    padding:13px 16px;display:flex;justify-content:space-between;align-items:center;
    box-shadow:0 8px 24px rgba(47,122,92,.4);
    transform:translateY(140px);opacity:0;
    transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .3s ease;
    cursor:pointer;z-index:50;
  }
  .cart-bar.show{transform:translateY(0);opacity:1;}
  .cart-bar-left{display:flex;align-items:center;gap:10px;}
  .cart-bar-count{
    background:rgba(255,255,255,.25);border-radius:50%;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;
  }
  .cart-bar-text{font-size:13px;font-weight:700;}
  .cart-bar-total{font-size:14.5px;font-weight:800;}

  /* ===== Cart sheet (bottom sheet overlay) ===== */
  .sheet-overlay{
    position:fixed;inset:0;background:rgba(15,61,62,.5);z-index:100;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .sheet-overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;max-height:86vh;
    background:var(--cream);border-radius:22px 22px 0 0;
    transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
    display:flex;flex-direction:column;
  }
  .sheet-overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:4px;margin:10px auto 6px;}
  .sheet-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 18px 12px;border-bottom:1px solid var(--line);
  }
  .sheet-title{font-family:'Fraunces',serif;font-size:18px;font-weight:700;}
  .sheet-close{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;padding:4px;}
  .sheet-body{overflow-y:auto;padding:12px 18px;flex:1;}
  .sheet-footer{padding:14px 18px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}

  .cart-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);}
  .cart-row:last-child{border-bottom:none;}
  .cart-row-img{width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,#F4EDE0,#EDE4D3);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0;}
  .cart-row-img img{width:100%;height:100%;object-fit:cover;}
  .cart-row-info{flex:1;min-width:0;}
  .cart-row-name{font-size:13px;font-weight:700;}
  .cart-row-price{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .cart-row-stepper{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .cart-row-stepper button{
    width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--cream-card);
    font-size:14px;font-weight:700;color:var(--teal-950);cursor:pointer;
  }
  .cart-row-qty{font-size:12.5px;font-weight:700;min-width:16px;text-align:center;}

  .sheet-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .sheet-total-label{font-size:13px;color:var(--ink-soft);}
  .sheet-total-amt{font-family:'Fraunces',serif;font-size:22px;font-weight:700;}

  .checkout-btn{
    width:100%;background:var(--amber);color:#fff;border:none;border-radius:14px;
    padding:15px;font-size:14.5px;font-weight:800;cursor:pointer;
    box-shadow:0 6px 16px rgba(232,134,58,.4);transition:transform .12s;
  }
  .checkout-btn:active{transform:scale(.98);}
  .checkout-btn:disabled{opacity:.5;box-shadow:none;}

  /* ===== Success screen ===== */
  .success-overlay{
    position:fixed;inset:0;background:var(--teal-950);z-index:200;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:30px;text-align:center;color:var(--cream);
  }
  .success-overlay.show{display:flex;}
  .success-check{
    width:76px;height:76px;border-radius:50%;background:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:36px;
    margin-bottom:18px;animation:checkPop .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes checkPop{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
  .success-title{font-family:'Fraunces',serif;font-size:21px;font-weight:700;margin-bottom:8px;}
  .success-sub{font-size:13px;opacity:.7;line-height:1.6;max-width:280px;}
  .success-detail{
    margin-top:20px;background:rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;
    font-size:13px;width:100%;max-width:280px;
  }
  .success-detail-row{display:flex;justify-content:space-between;padding:4px 0;}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="load-star">⭐</div>
  <div class="txt">ZarGo юкланмоқда...</div>
</div>

<div id="errorScreen">
  <div class="emoji">🔒</div>
  <p id="errorText">Сиз тизимда рўйхатдан ўтмагансиз. Администратор билан боғланинг.</p>
</div>

<div id="app" style="display:none;">
  <div class="header">
    <div class="header-greet">Хуш келибсиз</div>
    <div class="header-name" id="shopGreeting">—</div>
    <div class="header-debt">
      <span>Жорий қарз</span>
      <span class="amt" id="debtAmount">0с</span>
    </div>
  </div>

  <div class="cat-scroll" id="catScroll"></div>
  <div class="grid" id="productGrid"></div>
</div>

<div class="cart-bar" id="cartBar" onclick="openSheet()">
  <div class="cart-bar-left">
    <div class="cart-bar-count" id="cartCount">0</div>
    <div class="cart-bar-text">Саватни кўриш</div>
  </div>
  <div class="cart-bar-total" id="cartBarTotal">0с</div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">Саватингиз</div>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <div class="sheet-body" id="cartRows"></div>
    <div class="sheet-footer">
      <div class="sheet-total-row">
        <span class="sheet-total-label">Жами</span>
        <span class="sheet-total-amt" id="sheetTotal">0с</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">Буюртмани тасдиқлаш</button>
    </div>
  </div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-check">✅</div>
  <div class="success-title" id="successTitle">Буюртма қабул қилинди!</div>
  <div class="success-sub" id="successSub">Раҳмат! Тез орада етказиб берамиз.</div>
  <div class="success-detail" id="successDetail"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#0F3D3E'); tg.setBackgroundColor('#FBF7EF'); } catch(e) {}
}

const CATEGORY_LABELS = { Shokolad: '🍫 Шоколад', Saqiz: '🍬 Сагиз', Shirinlik: '🍭 Ширинлик', Sok: '🥤 Соки', Bozor: '🛒 Бозор' };
const CATEGORY_EMOJI = { Shokolad: '🍫', Saqiz: '🍬', Shirinlik: '🍭', Sok: '🥤', Bozor: '📦' };

let state = { shop: null, products: [], cart: [], activeCategory: 'all' };
let cartUpdateTimers = {};

async function api(action, extra) {
  const body = { initData: tg ? tg.initData : '', action, ...(extra || {}) };
  const res = await fetch('/api/miniapp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Xatolik');
  return data;
}

function fmt(n) {
  n = Number(n || 0);
  const neg = n < 0;
  n = Math.abs(n);
  const som = Math.floor(n);
  const dir = Math.round((n - som) * 100);
  const somStr = som.toLocaleString('ru-RU');
  const result = dir === 0 ? `${somStr}с` : `${somStr}с${String(dir).padStart(2, '0')}д`;
  return neg ? '-' + result : result;
}
function unitLabel(unit) { return { dona: 'дона', kg: 'кг', litr: 'литр', quti: 'қути', pachka: 'пачка', qop: 'қоп' }[unit] || 'дона'; }

async function init() {
  try {
    const data = await api('get_data');
    state.shop = data.shop;
    state.products = data.products;
    state.cart = data.cart;

    document.getElementById('shopGreeting').textContent = data.shop.owner_name || data.shop.name;
    updateDebtDisplay();
    renderCategories();
    renderGrid();
    updateCartBar();

    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch (e) {
    document.getElementById('loadingScreen').style.display = 'none';
    const errScreen = document.getElementById('errorScreen');
    errScreen.classList.add('show');
    if (e.message === 'not_registered') {
      document.getElementById('errorText').textContent = 'Сиз ҳали тизимда рўйхатдан ўтмагансиз. Администратор билан боғланинг.';
    } else if (e.message === 'blocked') {
      document.getElementById('errorText').textContent = 'Ҳисобингиз вақтинча блокланган. Администратор билан боғланинг.';
    } else {
      document.getElementById('errorText').textContent = 'Хатолик: ' + e.message;
    }
  }
}

function updateDebtDisplay() {
  const debtEl = document.getElementById('debtAmount');
  debtEl.textContent = fmt(state.shop.current_debt);
  debtEl.classList.toggle('warn', Number(state.shop.current_debt) > 0);
}

function renderCategories() {
  const cats = Array.from(new Set(state.products.map(p => p.category)));
  const container = document.getElementById('catScroll');
  container.innerHTML = ['all', ...cats].map(cat => `
    <div class="cat-pill ${state.activeCategory === cat ? 'active' : ''}" onclick="selectCategory('${cat}')">
      ${cat === 'all' ? '✨ Барчаси' : (CATEGORY_LABELS[cat] || cat)}
    </div>
  `).join('');
}

function selectCategory(cat) {
  state.activeCategory = cat;
  renderCategories();
  renderGrid();
}

function getCartQty(productId) {
  return state.cart.find(i => i.product_id === productId)?.qty || 0;
}

function renderGrid() {
  const filtered = state.activeCategory === 'all'
    ? state.products
    : state.products.filter(p => p.category === state.activeCategory);

  const grid = document.getElementById('productGrid');
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Бу категорияда товар йўқ</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const qty = getCartQty(p.id);
    const imgContent = p.image_url
      ? `<img src="${p.image_url}" alt="">`
      : (CATEGORY_EMOJI[p.category] || '📦');
    const isPackageUnit = ['quti', 'pachka', 'qop'].includes(p.unit);
    const unitSuffix = ` / ${unitLabel(p.unit)}`;
    const packageInfo = isPackageUnit && p.units_per_package
      ? `<div class="pcard-package-info">ичида ${p.units_per_package} дона</div>`
      : '';
    return `
      <div class="pcard" id="card-${p.id}">
        <div class="pcard-img">
          ${imgContent}
          <div class="stock-badge">${p.stock_qty} ${unitLabel(p.unit)}</div>
        </div>
        <div class="pcard-body">
          <div class="pcard-name">${p.name}</div>
          <div class="pcard-price">${fmt(p.price)}${unitSuffix}</div>
          ${packageInfo}
          <div class="pcard-actions" id="actions-${p.id}">
            ${qty > 0 ? stepperHtml(p.id, qty) : `<button class="add-btn" onclick="changeQty('${p.id}', 1)">+ Қўшиш</button>`}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function stepperHtml(productId, qty) {
  return `
    <div class="stepper">
      <button onclick="changeQty('${productId}', -1)">−</button>
      <span class="qty" id="qty-${productId}">${qty}</span>
      <button onclick="changeQty('${productId}', 1)">+</button>
    </div>
  `;
}

function changeQty(productId, delta) {
  const product = state.products.find(p => p.id === productId);
  if (!product) return;

  const current = getCartQty(productId);
  let next = current + delta;
  if (next < 0) next = 0;
  if (next > product.stock_qty) next = product.stock_qty;

  const existing = state.cart.find(i => i.product_id === productId);
  if (next === 0) {
    state.cart = state.cart.filter(i => i.product_id !== productId);
  } else if (existing) {
    existing.qty = next;
  } else {
    state.cart.push({ product_id: productId, qty: next });
  }

  // UI'ni darhol yangilaymiz (optimistik), serverga orqa fonda yuboramiz
  const actionsEl = document.getElementById('actions-' + productId);
  if (actionsEl) {
    actionsEl.innerHTML = next > 0 ? stepperHtml(productId, next) : `<button class="add-btn" onclick="changeQty('${productId}', 1)">+ Қўшиш</button>`;
    const qtyEl = document.getElementById('qty-' + productId);
    if (qtyEl) { qtyEl.classList.add('bump'); setTimeout(() => qtyEl.classList.remove('bump'), 250); }
  }
  const card = document.getElementById('card-' + productId);
  if (card) { card.classList.add('bump'); setTimeout(() => card.classList.remove('bump'), 300); }

  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

  updateCartBar();
  if (document.getElementById('sheetOverlay').classList.contains('open')) renderCartSheet();

  // Debounce qilib serverga yuboramiz — har bosishda emas
  clearTimeout(cartUpdateTimers[productId]);
  cartUpdateTimers[productId] = setTimeout(() => {
    api('update_cart', { productId, qty: next }).catch(() => {});
  }, 350);
}

function updateCartBar() {
  const bar = document.getElementById('cartBar');
  const totalItems = state.cart.reduce((s, i) => s + i.qty, 0);
  const total = state.cart.reduce((s, i) => {
    const p = state.products.find(pr => pr.id === i.product_id);
    return s + (p ? p.price * i.qty : 0);
  }, 0);

  document.getElementById('cartCount').textContent = totalItems;
  document.getElementById('cartBarTotal').textContent = fmt(total);
  bar.classList.toggle('show', totalItems > 0);
}

function openSheet() {
  if (state.cart.length === 0) return;
  renderCartSheet();
  document.getElementById('sheetOverlay').classList.add('open');
}

function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('open');
}

function renderCartSheet() {
  const rows = document.getElementById('cartRows');
  if (state.cart.length === 0) {
    rows.innerHTML = `<div class="empty-state">Саватингиз бўш</div>`;
    document.getElementById('sheetTotal').textContent = '0с';
    return;
  }

  let total = 0;
  rows.innerHTML = state.cart.map(item => {
    const p = state.products.find(pr => pr.id === item.product_id);
    if (!p) return '';
    const sum = p.price * item.qty;
    total += sum;
    const imgContent = p.image_url ? `<img src="${p.image_url}" alt="">` : (CATEGORY_EMOJI[p.category] || '📦');
    return `
      <div class="cart-row">
        <div class="cart-row-img">${imgContent}</div>
        <div class="cart-row-info">
          <div class="cart-row-name">${p.name}</div>
          <div class="cart-row-price">${fmt(p.price)} × ${item.qty} = ${fmt(sum)}</div>
        </div>
        <div class="cart-row-stepper">
          <button onclick="changeQty('${p.id}', -1)">−</button>
          <span class="cart-row-qty">${item.qty}</span>
          <button onclick="changeQty('${p.id}', 1)">+</button>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('sheetTotal').textContent = fmt(total);
}

async function checkout() {
  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true;
  btn.textContent = 'Юборилмоқда...';

  try {
    const result = await api('checkout');
    closeSheet();

    const successTitle = document.getElementById('successTitle');
    const successSub = document.getElementById('successSub');
    const successDetail = document.getElementById('successDetail');

    if (result.willExceedLimit) {
      successTitle.textContent = 'Буюртма қабул қилинди';
      successSub.textContent = 'Лимитдан ошгани учун администратор тасдиқлашини кутинг';
      successDetail.innerHTML = `
        <div class="success-detail-row"><span>Сумма</span><span>${fmt(result.total)}</span></div>
        <div class="success-detail-row"><span>Ҳолат</span><span>⏳ Кутмоқда</span></div>
      `;
    } else {
      successTitle.textContent = 'Буюртма қабул қилинди!';
      successSub.textContent = 'Раҳмат, тез орада етказиб берамиз';
      successDetail.innerHTML = `
        <div class="success-detail-row"><span>Сумма</span><span>${fmt(result.total)}</span></div>
        <div class="success-detail-row"><span>Янги қарз</span><span>${fmt(result.newDebt)}</span></div>
      `;
    }

    document.getElementById('successOverlay').classList.add('show');
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

    state.cart = [];
    updateCartBar();

    setTimeout(() => {
      if (tg) tg.close();
    }, 2600);
  } catch (e) {
    alert('Хатолик: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Буюртмани тасдиқлаш';
  }
}

init();
</script>

</body>
</html>
