<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZarGo — Админ панел</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-950:#0F3D3E;
    --teal-800:#155248;
    --cream:#FBF7EF;
    --cream-card:#FFFFFF;
    --amber:#E8863A;
    --amber-dark:#C96A22;
    --green:#2F7A5C;
    --ink:#1D2B28;
    --ink-soft:#5C6B67;
    --line:#E7E0D2;
    --red:#C6483D;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;}
  h1,h2,.disp{font-family:'Fraunces',serif;}

  /* Parol ekrani */
  .lock-screen{position:fixed;inset:0;background:var(--teal-950);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .lock-box{background:var(--cream-card);border-radius:16px;padding:28px 22px;max-width:320px;width:100%;text-align:center;}
  .lock-box h1{font-size:20px;margin:0 0 6px;}
  .lock-box p{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;}
  .lock-box input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;margin-bottom:10px;}
  .lock-box button{width:100%;background:var(--amber);color:#fff;border:none;border-radius:10px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .lock-error{color:var(--red);font-size:12px;margin-top:8px;min-height:16px;}

  .topbar{position:sticky;top:0;z-index:50;background:var(--teal-950);padding:14px 16px;}
  .topbar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .topbar-title{color:var(--cream);font-size:16px;font-weight:700;}
  .topbar-sub{color:rgba(251,247,239,.55);font-size:11.5px;margin-top:2px;}
  .refresh-btn{background:rgba(255,255,255,.1);border:none;color:var(--cream);padding:7px 12px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;}
  .refresh-btn:active{background:rgba(255,255,255,.2);}

  .tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:12px;padding:4px;overflow-x:auto;}
  .tab{flex-shrink:0;padding:9px 14px;border-radius:9px;font-size:12.5px;font-weight:600;color:rgba(251,247,239,.55);cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--amber);color:#1D2B28;}

  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 50px;}
  .view{display:none;}
  .view.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .loading{text-align:center;padding:40px 0;color:var(--ink-soft);font-size:13px;}
  .error-box{background:#FBE4E1;border:1px solid #F0BDB6;border-radius:12px;padding:14px;font-size:12.5px;color:var(--red);margin-bottom:12px;}

  .kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .kpi-row .kpi:first-child{grid-column:1 / -1;}
  .kpi{background:var(--teal-950);color:var(--cream);border-radius:14px;padding:14px 16px;}
  .kpi.alt{background:var(--cream-card);color:var(--ink);border:1px solid var(--line);}
  .kpi-label{font-size:11px;opacity:.7;margin-bottom:6px;}
  .kpi.alt .kpi-label{color:var(--ink-soft);opacity:1;}
  .kpi-value{font-family:'Fraunces',serif;font-size:22px;font-weight:700;}
  .kpi-value.warn{color:var(--red);}
  .kpi-value.good{color:var(--green);}

  .section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center;}
  .add-toggle{background:none;border:1px solid var(--line);color:var(--teal-800);border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700;cursor:pointer;}

  .card{background:var(--cream-card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;}
  .row-between{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-title{font-weight:700;font-size:13.5px;}
  .card-meta{font-size:11.3px;color:var(--ink-soft);margin-top:2px;}
  .amount{font-weight:700;font-size:14px;}
  .amount.high{color:var(--red);}
  .amount.ok{color:var(--green);}
  .tag{font-size:9.5px;padding:2px 7px;border-radius:20px;display:inline-block;margin-top:4px;font-weight:700;letter-spacing:.02em;}
  .tag.warn{background:#FBE4E1;color:var(--red);}
  .tag.ok{background:#E1F0E7;color:var(--green);}
  .tag.pending{background:#FDF3E1;color:var(--amber-dark);}
  .tag.neutral{background:#EEF1EF;color:var(--ink-soft);}

  .btn{border:none;border-radius:9px;padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer;}
  .btn-confirm{background:var(--green);color:#fff;}
  .btn-pay{background:var(--teal-950);color:var(--cream);}
  .btn-add{background:var(--amber);color:#fff;width:100%;padding:10px;margin-top:4px;}

  .stock-bar{width:100%;height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px;}
  .stock-fill{height:100%;border-radius:4px;}

  .order-items{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .empty-state{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:12.5px;}

  .pay-input-row{display:flex;gap:6px;margin-top:8px;}
  .pay-input-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:inherit;}

  .add-form{background:var(--cream-card);border:1px dashed var(--amber);border-radius:13px;padding:13px;margin-bottom:12px;display:none;}
  .add-form.open{display:block;}
  .add-form input,.add-form select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit;margin-bottom:8px;}
  .add-form label{font-size:11px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:3px;}
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h1>🔒 ZarGo Admin</h1>
    <p>Davom etish uchun parolni kiriting</p>
    <input type="password" id="pwInput" placeholder="Parol" onkeydown="if(event.key==='Enter') tryLogin()">
    <button onclick="tryLogin()">Kirish</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<div class="topbar">
  <div class="topbar-row">
    <div>
      <div class="topbar-title">ZarGo · Админ панел</div>
      <div class="topbar-sub" id="lastUpdated">—</div>
    </div>
    <button class="refresh-btn" onclick="loadAll()">↻ Янгилаш</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="dashboard" onclick="showTab('dashboard')">Дашборд</div>
    <div class="tab" data-tab="shops" onclick="showTab('shops')">Дўконлар</div>
    <div class="tab" data-tab="orders" onclick="showTab('orders')">Буюртмалар</div>
    <div class="tab" data-tab="products" onclick="showTab('products')">Товарлар</div>
  </div>
</div>

<div class="wrap">
  <div id="globalError"></div>

  <div class="view active" id="view-dashboard">
    <div id="dashboardContent" class="loading">Юкланмоқда...</div>
  </div>

  <div class="view" id="view-shops">
    <div class="section-label">
      <span>Дўконлар</span>
      <button class="add-toggle" onclick="toggleForm('addShopForm')">+ Янги дўкон</button>
    </div>
    <div class="add-form" id="addShopForm">
      <label>Дўкон номи</label>
      <input id="ns-name" placeholder="Масалан: Дўкон №5 — Чорсу">
      <label>Эгасининг исми</label>
      <input id="ns-owner" placeholder="Масалан: Аҳмад ака">
      <label>Телефон</label>
      <input id="ns-phone" placeholder="+992...">
      <label>Қарз лимити (сўм)</label>
      <input id="ns-limit" type="number" placeholder="1000000">
      <button class="btn btn-add" onclick="submitAddShop()">Дўкон қўшиш</button>
    </div>
    <div id="shopsContent" class="loading">Юкланмоқда...</div>
  </div>

  <div class="view" id="view-orders">
    <div id="ordersContent" class="loading">Юкланмоқда...</div>
  </div>

  <div class="view" id="view-products">
    <div class="section-label">
      <span>Товарлар</span>
      <button class="add-toggle" onclick="toggleForm('addProductForm')">+ Янги товар</button>
    </div>
    <div class="add-form" id="addProductForm">
      <label>Категория</label>
      <input id="np-category" placeholder="Масалан: Shokolad">
      <label>Номи</label>
      <input id="np-name" placeholder="Масалан: Milka 100g">
      <label>Нархи (дона)</label>
      <input id="np-price" type="number" placeholder="5000">
      <label>Бошланғич қолдиқ</label>
      <input id="np-stock" type="number" placeholder="200">
      <label>Расм URL (ихтиёрий)</label>
      <input id="np-image" placeholder="https://...">
      <button class="btn btn-add" onclick="submitAddProduct()">Товар қўшиш</button>
    </div>
    <div id="productsContent" class="loading">Юкланмоқда...</div>
  </div>
</div>

<script>
const BOT_USERNAME = 'ZarGoAI_bot'; // Agar bot username boshqacha bo'lsa, shu yerni o'zgartiring
let ADMIN_PASSWORD = '';

function tryLogin() {
  const pw = document.getElementById('pwInput').value;
  if (!pw) return;
  ADMIN_PASSWORD = pw;
  fetch('/api/admin', { headers: { 'x-admin-password': pw } })
    .then(async res => {
      if (!res.ok) throw new Error('wrong');
      const data = await res.json();
      sessionStorage.setItem('zargo_admin_pw', pw);
      document.getElementById('lockScreen').style.display = 'none';
      applyData(data);
    })
    .catch(() => {
      document.getElementById('lockError').textContent = "Нотўғри парол, қайта уриниб кўринг";
    });
}

// Sahifa ochilganda avval saqlangan parolni tekshiramiz
window.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('zargo_admin_pw');
  if (saved) {
    ADMIN_PASSWORD = saved;
    loadAll();
  }
});

let state = { shops: [], products: [], orders: [] };

async function api(body) {
  const opts = body
    ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-password': ADMIN_PASSWORD }, body: JSON.stringify(body) }
    : { headers: { 'x-admin-password': ADMIN_PASSWORD } };
  const res = await fetch('/api/admin', opts);
  if (res.status === 401) {
    sessionStorage.removeItem('zargo_admin_pw');
    document.getElementById('lockScreen').style.display = 'flex';
    throw new Error('Парол нотўғри, қайта киринг');
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Хатолик');
  return data;
}

function fmt(n) { return Number(n || 0).toLocaleString('ru-RU'); }

function showTab(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');
}

function toggleForm(id) {
  document.getElementById(id).classList.toggle('open');
}

async function loadAll() {
  document.getElementById('globalError').innerHTML = '';
  document.getElementById('lastUpdated').textContent = 'Юкланмоқда...';
  try {
    const data = await api();
    applyData(data);
  } catch (e) {
    document.getElementById('globalError').innerHTML =
      `<div class="error-box">Маълумот юкланмади: ${e.message}</div>`;
    document.getElementById('lastUpdated').textContent = 'Хатолик';
  }
}

function applyData(data) {
  state.shops = data.shops || [];
  state.products = data.products || [];
  state.orders = data.orders || [];
  document.getElementById('lockScreen').style.display = 'none';
  renderDashboard();
  renderShops();
  renderOrders();
  renderProducts();
  const now = new Date();
  document.getElementById('lastUpdated').textContent =
    'Янгиланди: ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function renderDashboard() {
  const totalDebt = state.shops.reduce((sum, s) => sum + Number(s.current_debt || 0), 0);
  const totalLimit = state.shops.reduce((sum, s) => sum + Number(s.debt_limit || 0), 0);
  const pendingOrders = state.orders.filter(o => o.status === 'pending').length;
  const blockedShops = state.shops.filter(s => s.status === 'blocked').length;
  const todayStr = new Date().toISOString().slice(0, 10);
  const todayOrders = state.orders.filter(o => (o.created_at || '').slice(0, 10) === todayStr).length;

  let html = `
    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-label">Умумий қарздорлик (${state.shops.length} дўкон)</div>
        <div class="kpi-value">${fmt(totalDebt)} сўм</div>
        <div class="kpi-label" style="margin-top:4px;">Лимит жами: ${fmt(totalLimit)} сўм</div>
      </div>
      <div class="kpi alt">
        <div class="kpi-label">Бугунги буюртма</div>
        <div class="kpi-value good">${todayOrders} та</div>
      </div>
      <div class="kpi alt">
        <div class="kpi-label">Тасдиқ кутаётган</div>
        <div class="kpi-value ${pendingOrders > 0 ? 'warn' : 'good'}">${pendingOrders} та</div>
      </div>
    </div>
  `;

  if (blockedShops > 0) {
    html += `<div class="section-label"><span>⚠️ Диққат талаб қилади</span></div>`;
    state.shops.filter(s => s.status === 'blocked').forEach(s => {
      html += `<div class="card"><div class="card-title">🔴 ${s.name}</div>
        <div class="card-meta">${s.owner_name} — лимит тўлган, қарз ${fmt(s.current_debt)} сўм</div></div>`;
    });
  }

  if (pendingOrders > 0) {
    html += `<div class="section-label"><span>⏳ Тасдиқлашни кутаётган буюртмалар</span></div>`;
    state.orders.filter(o => o.status === 'pending').forEach(o => { html += renderOrderCard(o); });
  }

  const lowStock = state.products.filter(p => p.stock_qty <= p.low_stock_threshold);
  if (lowStock.length > 0) {
    html += `<div class="section-label"><span>📦 Захираси камайган</span></div>`;
    lowStock.forEach(p => {
      const pct = Math.min(100, Math.round((p.stock_qty / (p.low_stock_threshold * 3)) * 100));
      html += `<div class="card"><div class="card-title">${p.name}</div>
        <div class="card-meta">${p.stock_qty} дона қолди</div>
        <div class="stock-bar"><div class="stock-fill" style="width:${pct}%;background:var(--red);"></div></div></div>`;
    });
  }

  if (blockedShops === 0 && pendingOrders === 0 && lowStock.length === 0) {
    html += `<div class="empty-state">✅ Ҳозирча диққат талаб қиладиган нарса йўқ</div>`;
  }
  document.getElementById('dashboardContent').innerHTML = html;
}

function renderShops() {
  if (state.shops.length === 0) {
    document.getElementById('shopsContent').innerHTML = `<div class="empty-state">Ҳали дўкон қўшилмаган</div>`;
    return;
  }
  let html = '';
  state.shops.forEach(s => {
    const isHigh = Number(s.current_debt) >= Number(s.debt_limit) * 0.8;
    const statusTag = s.status === 'blocked' ? '<span class="tag warn">Блокланган</span>'
      : s.status === 'pending_link' ? '<span class="tag neutral">Улaнмаган</span>'
      : '<span class="tag ok">Актив</span>';
    const linkBtn = s.status === 'pending_link'
      ? `<button class="btn btn-pay" style="margin-top:8px;width:100%;" onclick="copyLinkFor('${s.id}','${s.name.replace(/'/g, "")}')">🔗 Улаш линкини нусха олиш</button>`
      : '';
    html += `
      <div class="card">
        <div class="row-between">
          <div>
            <div class="card-title">${s.name}</div>
            <div class="card-meta">${s.owner_name || ''} ${s.owner_phone ? '· ' + s.owner_phone : ''}</div>
            ${statusTag}
          </div>
          <div style="text-align:right;">
            <div class="amount ${isHigh ? 'high' : 'ok'}">${fmt(s.current_debt)}</div>
            <div class="card-meta">лимит ${fmt(s.debt_limit)}</div>
          </div>
        </div>
        ${linkBtn}
        <div class="pay-input-row">
          <input type="number" placeholder="Тўлов суммаси" id="pay-${s.id}">
          <button class="btn btn-pay" onclick="submitPayment('${s.id}')">Тўлов қабул қилиш</button>
        </div>
      </div>
    `;
  });
  document.getElementById('shopsContent').innerHTML = html;
}

function copyLinkFor(shopId, shopName) {
  const link = `https://t.me/${BOT_USERNAME}?start=${shopId}`;
  navigator.clipboard.writeText(link).then(() => {
    alert(`Линк нусха олинди!\n\n${shopName} учун:\n${link}\n\nEndi shu linkni do'kon egasiga Telegram yoki WhatsApp orqali yuboring.`);
  }).catch(() => {
    prompt('Линкни қўлда нусха олинг:', link);
  });
}

function renderOrderCard(o) {
  const shopName = o.shops ? o.shops.name : 'Номаълум дўкон';
  const ownerName = o.shops ? o.shops.owner_name : '';
  const itemsText = (o.order_items || []).map(i => `${i.products ? i.products.name : '?'} × ${i.qty}`).join(', ');
  const statusTag = o.status === 'pending' ? '<span class="tag pending">Кутмоқда</span>'
    : o.status === 'confirmed' ? '<span class="tag ok">Тасдиқланган</span>'
    : o.status === 'delivered' ? '<span class="tag ok">Етказилган</span>'
    : '<span class="tag neutral">Бекор қилинган</span>';
  const dateStr = new Date(o.created_at).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

  let html = `
    <div class="card">
      <div class="row-between">
        <div>
          <div class="card-title">${shopName}</div>
          <div class="card-meta">${ownerName} · ${dateStr}</div>
          ${statusTag}
        </div>
        <div class="amount">${fmt(o.total_amount)} сўм</div>
      </div>
      <div class="order-items">${itemsText}</div>
  `;
  if (o.status === 'pending') {
    html += `<div style="margin-top:8px;"><button class="btn btn-confirm" onclick="confirmOrder('${o.id}')">✅ Тасдиқлаш</button></div>`;
  }
  html += `</div>`;
  return html;
}

function renderOrders() {
  if (state.orders.length === 0) {
    document.getElementById('ordersContent').innerHTML = `<div class="empty-state">Ҳали буюртма йўқ</div>`;
    return;
  }
  document.getElementById('ordersContent').innerHTML = state.orders.map(renderOrderCard).join('');
}

function renderProducts() {
  if (state.products.length === 0) {
    document.getElementById('productsContent').innerHTML = `<div class="empty-state">Ҳали товар қўшилмаган</div>`;
    return;
  }
  let html = '';
  state.products.forEach(p => {
    const pct = Math.min(100, Math.round((p.stock_qty / (p.low_stock_threshold * 3)) * 100));
    const isLow = p.stock_qty <= p.low_stock_threshold;
    html += `
      <div class="card">
        <div class="row-between">
          <div>
            <div class="card-title">${p.name}</div>
            <div class="card-meta">${p.category} · ${fmt(p.price)} сўм/дона</div>
          </div>
          <div class="amount ${isLow ? 'high' : ''}">${p.stock_qty} дона</div>
        </div>
        <div class="stock-bar"><div class="stock-fill" style="width:${pct}%;background:${isLow ? 'var(--red)' : 'var(--green)'};"></div></div>
      </div>
    `;
  });
  document.getElementById('productsContent').innerHTML = html;
}

async function confirmOrder(orderId) {
  if (!confirm('Шу буюртмани тасдиқлайсизми?')) return;
  try {
    await api({ action: 'confirm_order', orderId });
    await loadAll();
  } catch (e) { alert('Хатолик: ' + e.message); }
}

async function submitPayment(shopId) {
  const input = document.getElementById('pay-' + shopId);
  const amount = parseFloat(input.value);
  if (!amount || amount <= 0) { alert('Илтимос, тўғри сумма киритинг'); return; }
  try {
    await api({ action: 'add_payment', shopId, amount });
    input.value = '';
    await loadAll();
  } catch (e) { alert('Хатолик: ' + e.message); }
}

async function submitAddShop() {
  const name = document.getElementById('ns-name').value.trim();
  const ownerName = document.getElementById('ns-owner').value.trim();
  const ownerPhone = document.getElementById('ns-phone').value.trim();
  const debtLimit = parseFloat(document.getElementById('ns-limit').value) || 0;
  if (!name || !ownerName) { alert('Дўкон номи ва эгасининг исмини киритинг'); return; }
  try {
    await api({ action: 'add_shop', name, ownerName, ownerPhone, debtLimit });
    document.getElementById('ns-name').value = '';
    document.getElementById('ns-owner').value = '';
    document.getElementById('ns-phone').value = '';
    document.getElementById('ns-limit').value = '';
    toggleForm('addShopForm');
    await loadAll();
  } catch (e) { alert('Хатолик: ' + e.message); }
}

async function submitAddProduct() {
  const category = document.getElementById('np-category').value.trim();
  const name = document.getElementById('np-name').value.trim();
  const price = parseFloat(document.getElementById('np-price').value);
  const stockQty = parseInt(document.getElementById('np-stock').value) || 0;
  const imageUrl = document.getElementById('np-image').value.trim();
  if (!category || !name || !price) { alert('Категория, номи ва нархини киритинг'); return; }
  try {
    await api({ action: 'add_product', category, name, price, stockQty, imageUrl });
    document.getElementById('np-category').value = '';
    document.getElementById('np-name').value = '';
    document.getElementById('np-price').value = '';
    document.getElementById('np-stock').value = '';
    document.getElementById('np-image').value = '';
    toggleForm('addProductForm');
    await loadAll();
  } catch (e) { alert('Хатолик: ' + e.message); }
}
</script>
